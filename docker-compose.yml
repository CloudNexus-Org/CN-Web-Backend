# Local / demo: API + MongoDB
services:
  db:
    image: mongo:7.0-alpine
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  api:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: mongodb://db:27017/cloudnexus
      JWT_SECRET: ${JWT_SECRET:-change_me_min_32_chars_for_local_dev_only}
      PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads

volumes:
  mongodata:
  uploads_data:
